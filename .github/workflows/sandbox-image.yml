name: Sandbox checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sandbox/**", "zed", ".github/workflows/sandbox-image.yml", ".github/actions/**"]
  pull_request:
    paths: ["sandbox/**", "zed", ".github/workflows/sandbox-image.yml", ".github/actions/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --check --build-arg BASE_IMAGE=ubuntu:26.04 -f sandbox/image/Dockerfile .
      - run: shellcheck sandbox/image/build.sh sandbox/image/build-server.sh
      - run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile sandbox/image/export-project.py sandbox/image/kernel.py

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action, pinned compiler
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: sandbox/supervisor
      - run: cargo fmt --check
        working-directory: sandbox/supervisor
      - run: cargo clippy --locked --lib --bins -- -D warnings
        working-directory: sandbox/supervisor
      - run: cargo build --locked --release
        working-directory: sandbox/supervisor
