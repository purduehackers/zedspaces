name: web

on:
  workflow_call:
    inputs:
      browser_e2e:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      browser_e2e:
        description: "also run the browser end-to-end suite (tests/e2e-browser) on Chromium"
        type: boolean
        default: false
  # The browser suite runs nightly (BUILD-SPEC 13 "End to end"); lint/typecheck/test are not repeated for it.
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

jobs:
  web:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  browser-e2e:
    # The Playwright suite against the local backend (apps/web/tests/e2e-browser, driven by
    # scripts/dev-local.sh browser): builds zs-agent, zed-remote-server and the test-hooks wasm
    # bundle (script/build-web --test-hooks) from the fork, then runs the Chromium project with
    # SQLite/libSQL. Nightly, or on demand with `browser_e2e`; never part of a push/PR run.
    name: browser e2e (chromium, local backend)
    runs-on: ${{ vars.ZS_BUILD_RUNNER || 'ubuntu-24.04' }}
    if: github.event_name == 'schedule' || inputs.browser_e2e == true
    timeout-minutes: 120
    concurrency:
      group: browser-e2e
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: "2"
      ZS_DEV_DB: sqlite
      ZS_E2E_CI: "1"
      # Ubuntu runners have no GPU: the config asks Chromium for SwiftShader off macOS.
      ZS_E2E_BOOT_BUDGET_MS: "60000"
      ZS_SKIP_PLAYWRIGHT_INSTALL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-zed
        with:
          wasm: "true"
          cache-key: browser-e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: browser end-to-end suite
        run: bash .github/scripts/build-metrics.sh bash -c 'cd apps/web && ./scripts/dev-local.sh browser --project=chromium'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-browser
          path: |
            apps/web/test-results/e2e-browser-report
            apps/web/test-results/e2e-browser-results.json
            apps/web/test-results/e2e-browser-timings.json
            apps/web/.zs-dev/next-browser.log
            apps/web/.zs-dev/build-web.log
            build-resources.log
          if-no-files-found: warn
