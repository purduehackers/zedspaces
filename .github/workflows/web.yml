name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:
    inputs:
      browser_e2e:
        description: "also run the browser end-to-end suite (tests/e2e-browser) on Chromium"
        type: boolean
        default: false
  # The browser suite runs nightly (BUILD-SPEC 13 "End to end"); lint/typecheck/test are not repeated for it.
  schedule:
    - cron: "41 5 * * *"

jobs:
  web:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  browser-e2e:
    # The Playwright suite against the local backend (apps/web/tests/e2e-browser, driven by
    # scripts/dev-local.sh browser): builds zs-agent, zed-remote-server and the test-hooks wasm
    # bundle (script/build-web --test-hooks) from the fork, then runs the Chromium project with
    # SQLite/libSQL. Nightly, or on demand with `browser_e2e`; never part of a push/PR run.
    name: browser e2e (chromium, local backend)
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.browser_e2e)
    timeout-minutes: 120
    concurrency:
      group: browser-e2e
      cancel-in-progress: false
    env:
      ZS_DEV_DB: sqlite
      ZS_E2E_CI: "1"
      # Ubuntu runners have no GPU: the config asks Chromium for SwiftShader off macOS.
      ZS_E2E_BOOT_BUDGET_MS: "60000"
      ZS_SKIP_PLAYWRIGHT_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: "wasm toolchain for script/build-web (wasm-bindgen-cli, binaryen, brotli, wasi-sdk)"
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen brotli clang lld
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          (cd zed && ./script/ensure-wasi-sdk)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zed -> target
            sandbox/supervisor -> target
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: browser end-to-end suite
        run: ./scripts/dev-local.sh browser --project=chromium
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-browser
          path: |
            apps/web/test-results/e2e-browser-report
            apps/web/test-results/e2e-browser-results.json
            apps/web/test-results/e2e-browser-timings.json
            apps/web/.zs-dev/next-browser.log
            apps/web/.zs-dev/build-web.log
          if-no-files-found: warn
