name: web

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml", ".github/actions/**", ".github/scripts/**"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml", ".github/actions/**", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  web:
    name: lint, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
